name: Lint Workflow

on:
  push:
    branches:
      - main
      - t2
      - t3
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
      - name: Setup kube-linter
        run: |
          curl -sSL https://github.com/stackrox/kube-linter/releases/latest/download/kube-linter-linux.tar.gz | tar -xz
          sudo mv kube-linter /usr/local/bin/kube-linter
      - uses: terraform-linters/setup-tflint@v6
        name: Setup TFLint
        with:
          tflint_version: v0.64.0
      - uses: pre-commit/action@v3.0.1
  kube-lint:
    name: Lint Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Kubernetes Manifests
        uses: stackrox/kube-linter-action@v1.0.7
        with:
          directory: k8s
          format: sarif
          output-file: kube-linter.sarif

      - name: Upload Kube Linter SARIF Report
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: kube-linter.sarif

  tf-lint:
    name: Lint Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        name: Setup TFLint
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: |
          set -o pipefail
          tflint -f sarif | tee tflint.sarif

      - name: Upload TFLint SARIF Report
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: tflint.sarif
