name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/deployments/togglemaster-infra/**'
      - 'terraform/deployments/togglemaster-app/**'
      - 'terraform/modules/**'
      - '.github/workflows/tf-plan.yaml'

  workflow_call:
    inputs:
      environment:
        description: "Terraform environment to deploy to: dev or prod"
        required: false
        default: "dev"
        type: string
      deployment:
        description: "Terraform deployment to run: infra or app"
        required: false
        default: "infra"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set.outputs.environments }}
      deployments: ${{ steps.set.outputs.deployments }}
    steps:
      - id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'environments=["dev","prod"]' >> "$GITHUB_OUTPUT"
            echo 'deployments=["infra","app"]' >> "$GITHUB_OUTPUT"
          else
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
            echo 'deployments=["${{ inputs.deployment }}"]' >> "$GITHUB_OUTPUT"
          fi

  terraform-plan:
    name: Terraform Plan ${{ matrix.deployment }} ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.setup.outputs.environments) }}
        deployment: ${{ fromJson(needs.setup.outputs.deployments) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config="key=togglemaster/${{ matrix.deployment }}/${{ matrix.environment }}/terraform.tfstate" -backend-config="access_key=$R2_ACCESS_KEY_ID" -backend-config="secret_key=$R2_SECRET_ACCESS_KEY"

      - name: Terraform Validate
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        run: terraform validate

      - name: Terraform Plan
        shell: bash
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        run: |
          # Captures the exit code from the plan command
          set +e
          terraform plan -var-file=${{ matrix.environment }}.tfvars -detailed-exitcode -out=tfplan
          code=$?
          set -e

          if [ $code -eq 1 ]; then
            exit 1
          elif [ $code -eq 2 ]; then
            echo "Has changes for ${{ matrix.deployment }} ${{ matrix.environment }}"
          else
            echo "No changes for ${{ matrix.deployment }} ${{ matrix.environment }}"
          fi

      - name: Save Terraform Plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ matrix.deployment }}-${{ matrix.environment }}
          path: terraform/deployments/togglemaster-${{ matrix.deployment }}/tfplan
