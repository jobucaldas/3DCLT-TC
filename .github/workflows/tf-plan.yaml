name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/deployments/togglemaster-infra/**'
      - 'terraform/deployments/togglemaster-app/**'
      - 'terraform/modules/**'
      - '.github/workflows/tf-plan.yaml'

  workflow_call:
    inputs:
      environment:
        description: "Terraform environment to deploy to: dev or prod"
        required: false
        default: "dev"
        type: string
      deployment:
        description: "Terraform deployment to run: infra or app"
        required: false
        default: "infra"
        type: string
    outputs:
      has_changes:
        description: "Whether terraform plan detected changes"
        value: ${{ jobs.terraform-plan.outputs.has_changes }}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix={"include":[{"environment":"dev","deployment":"infra"},{"environment":"prod","deployment":"infra"},{"environment":"prod","deployment":"app"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"environment":"${{ inputs.environment }}","deployment":"${{ inputs.deployment }}"}]}' >> "$GITHUB_OUTPUT"
          fi

  terraform-plan:
    name: Terraform Plan ${{ matrix.deployment }} ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Format
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config="key=togglemaster/${{ matrix.deployment }}/${{ matrix.environment }}/terraform.tfstate" -backend-config="access_key=$R2_ACCESS_KEY_ID" -backend-config="secret_key=$R2_SECRET_ACCESS_KEY"

      - name: Terraform Validate
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        run: terraform validate

      - name: Check EKS cluster
        id: cluster
        if: github.event_name == 'pull_request' && matrix.deployment == 'app'
        shell: bash
        run: |
          if out=$(aws eks describe-cluster --name togglemaster-${{ matrix.environment }}-eks 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q ResourceNotFoundException; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

      - name: Build skipped plan comment
        if: steps.cluster.outputs.exists == 'false'
        shell: bash
        run: |
          printf '%s\n' \
            "<!-- tf-plan-${{ matrix.deployment }}-${{ matrix.environment }} -->" \
            "### Terraform Plan ${{ matrix.deployment }} ${{ matrix.environment }}" \
            "" \
            "Plan ignorado: o cluster togglemaster-${{ matrix.environment }}-eks não existe. Suba o ambiente pelo pipeline de CD e rode este check de novo." \
            > "$RUNNER_TEMP/comment.md"

      - name: Terraform Plan
        id: plan
        if: steps.cluster.outputs.exists != 'false'
        shell: bash
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        run: |
          # Captures the exit code from the plan command
          set +e
          terraform plan -var-file=${{ matrix.environment }}.tfvars -detailed-exitcode -out=tfplan
          code=$?
          set -e

          if [ $code -eq 1 ]; then
            exit 1
          elif [ $code -eq 2 ]; then
            echo "Has changes for ${{ matrix.deployment }} ${{ matrix.environment }}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes for ${{ matrix.deployment }} ${{ matrix.environment }}"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plan comment
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        shell: bash
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        run: |
          terraform show -json tfplan | jq -r \
            --arg title "Terraform Plan ${{ matrix.deployment }} ${{ matrix.environment }}" \
            --arg marker "<!-- tf-plan-${{ matrix.deployment }}-${{ matrix.environment }} -->" '
            def acao:
              if . == ["create"] then "Criar"
              elif . == ["update"] then "Modificar"
              elif . == ["delete"] then "Destruir"
              elif sort == ["create", "delete"] then "Recriar"
              else join("+") end;
            [.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])] as $c
            | [$c[] | .change.actions | acao] as $l
            | "\($marker)\n### \($title)\n\n" +
              if ($l | length) == 0 then "Sem mudanças na infraestrutura."
              else
                "Criar: \($l | map(select(. == "Criar")) | length), Modificar: \($l | map(select(. == "Modificar")) | length), Destruir: \($l | map(select(. == "Destruir")) | length), Recriar: \($l | map(select(. == "Recriar")) | length)\n\n| Ação | Recurso |\n|---|---|\n" +
                ($c[:200] | map("| \(.change.actions | acao) | `\(.address)` |") | join("\n")) +
                (if ($c | length) > 200 then "\n\n... e mais \($c | length - 200) recursos." else "" end)
              end
          ' > "$RUNNER_TEMP/comment.md"

      - name: Post PR comment
        if: github.event_name == 'pull_request' && (steps.cluster.outputs.exists == 'false' || steps.plan.outcome == 'success')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- tf-plan-${{ matrix.deployment }}-${{ matrix.environment }} -->"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi

      - name: Save Terraform Plan
        if: steps.cluster.outputs.exists != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ matrix.deployment }}-${{ matrix.environment }}
          path: terraform/deployments/togglemaster-${{ matrix.deployment }}/tfplan
