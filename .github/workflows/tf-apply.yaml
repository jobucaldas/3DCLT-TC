name: Terraform Apply

on:
  workflow_call:
    inputs:
      deployment:
        description: Terraform deployment
        required: false
        default: infra
        type: string
      environment:
        description: Terraform environment
        required: false
        default: prod
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: Terraform Plan (${{ inputs.deployment }} ${{ inputs.environment }})
    uses: ./.github/workflows/tf-plan.yaml
    with:
      environment: ${{ inputs.environment }}
      deployment: ${{ inputs.deployment }}
    secrets: inherit

  terraform-apply:
    name: Terraform Apply (${{ inputs.deployment }} ${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/deployments/togglemaster-${{ inputs.deployment }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config="key=togglemaster/${{ inputs.deployment }}/${{ inputs.environment }}/terraform.tfstate" -backend-config="access_key=$R2_ACCESS_KEY_ID" -backend-config="secret_key=$R2_SECRET_ACCESS_KEY"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v7
        with:
          name: terraform-plan-${{ inputs.deployment }}-${{ inputs.environment }}
          path: terraform/deployments/togglemaster-${{ inputs.deployment }}

      - name: Terraform Apply
        shell: bash
        working-directory: terraform/deployments/togglemaster-${{ inputs.deployment }}
        run: terraform apply -auto-approve tfplan
