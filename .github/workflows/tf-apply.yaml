name: Terraform Apply

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: Terraform Plan (${{ matrix.deployment }} ${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
        deployment: [infra, app]
    uses: ./.github/workflows/tf-plan.yaml
    with:
      environment: ${{ matrix.environment }}
      deployment: ${{ matrix.deployment }}
    secrets: inherit

  terraform-apply:
    name: Terraform Apply (${{ matrix.deployment }} ${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: terraform-plan
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
        deployment: [infra, app]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config='key=togglemaster/${{ matrix.deployment }}/${{ matrix.environment }}/terraform.tfstate' -backend-config='access_key=$R2_ACCESS_KEY_ID' -backend-config='secret_key=$R2_SECRET_ACCESS_KEY'

      - name: Download Terraform Plan
        uses: actions/download-artifact@v7
        with:
          name: terraform-plan-${{ matrix.deployment }}-${{ matrix.environment }}
          path: terraform/deployments/togglemaster-${{ matrix.deployment }}

      - name: Terraform Apply
        shell: bash
        working-directory: terraform/deployments/togglemaster-${{ matrix.deployment }}
        run: terraform apply -auto-approve tfplan
