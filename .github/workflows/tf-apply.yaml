name: Terraform Apply

on:
  push:
    branches: [main, t2, t3]
    paths:
      - 'terraform/deployments/togglemaster/**'
      - 'terraform/modules/**'
      - '.github/workflows/tf-apply.yaml'
      - '.github/workflows/tf-plan.yaml'

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    uses: ./.github/workflows/tf-plan.yaml
    with:
      environment: ${{ matrix.environment }}
    secrets: inherit

  terraform-apply:
    name: Terraform Apply ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: terraform-plan
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/deployments/togglemaster
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config="key=togglemaster/${{ matrix.environment }}/terraform.tfstate" -backend-config="access_key=$R2_ACCESS_KEY_ID" -backend-config="secret_key=$R2_SECRET_ACCESS_KEY"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v7
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: terraform/deployments/togglemaster

      - name: Terraform Apply
        shell: bash
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        working-directory: terraform/deployments/togglemaster
        run: terraform apply -var-file=${{ matrix.environment }}.tfvars -auto-approve tfplan
