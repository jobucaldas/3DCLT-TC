name: Security Tests

on:
  push:
    branches:
      - main
      - t2
      - t3
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Check for Secrets with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  trivy:
    name: Trivy Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-report.json

      - name: Save Trivy Report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-report
          path: trivy-report.json

      - name: SARIF Upload
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: trivy-report.json

  checkov-terraform:
    name: Checkov Terraform Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkov Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,terraform-results.sarif

      - name: Upload Terraform SARIF file
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        with:
          sarif_file: terraform-results.sarif

  checkov-kubernetes:
    name: Checkov Kubernetes Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render root Kubernetes manifests
        run: kubectl kustomize k8s > k8s-rendered.yaml

      - name: Checkov Kubernetes
        uses: bridgecrewio/checkov-action@v12
        with:
          file: k8s-rendered.yaml
          framework: kubernetes
          output_format: cli,sarif
          output_file_path: console,kubernetes-results.sarif

      - name: Upload Kubernetes SARIF file
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        with:
          sarif_file: kubernetes-results.sarif

  checkov-github-actions:
    name: Checkov GitHub Actions Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkov GitHub Actions
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .github/workflows
          framework: github_actions
          output_format: cli,sarif
          output_file_path: console,github-actions-results.sarif

      - name: Upload GitHub Actions SARIF file
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        with:
          sarif_file: github-actions-results.sarif
