name: Terraform Deploy

on:
  push:
    branches:
      - main
      - t2
      - t3

  workflow_call:
    inputs:
      environment:
        description: "Terraform environment to deploy to: dev or prod"
        required: false
        default: "dev"
        type: string

permissions:
  contents: read
  id-token: write


jobs:
  terraform-plan:
    uses: ./.github/workflows/tf-plan.yaml
    with:
      environment: ${{ inputs.environment || 'dev' }}

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/deployments/togglemaster
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v7
        with:
          name: terraform-plan
          path: .

      - name: Terraform Apply
        shell: bash
        env:
          TF_VAR_db_password: ${{ secrets.db_password }}
        working-directory: terraform/deployments/togglemaster
        run: terraform apply -var-file=terraform/deployments/togglemaster/${{ inputs.environment || 'dev' }}.tfvars -auto-approve tfplan
