name: Golang Lint
description: Run golangci-lint against a Go project

inputs:
  go-version:
    description: Go version to install
    required: false
    default: stable
  golangci-lint-version:
    description: golangci-lint version to install
    required: false
    default: v2.13
  working-directory:
    description: Directory containing the Go project to lint
    required: false
    default: '.'
  report-file:
    description: SARIF report path relative to the working directory
    required: false
    default: golangci-lint-report.json

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}

    - name: Lint Go Code
      uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ inputs.golangci-lint-version }}
        working-directory: ${{ inputs.working-directory }}
        args: --output.sarif.path=${{ inputs.report-file }}

    - name: Upload GolangCI-Lint SARIF Report
      if: always()
      uses: github/codeql-action/upload-sarif@v4.37.9
      with:
        sarif_file: ${{ inputs.working-directory }}/${{ inputs.report-file }}
