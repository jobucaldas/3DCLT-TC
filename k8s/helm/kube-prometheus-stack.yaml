apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd-prod
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.1.2
    helm:
      valuesObject:
        fullnameOverride: kps
        alertmanager:
          enabled: true
          config:
            route:
              receiver: "null"
              group_by: [alertname, service_name]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
              - receiver: "null"
                matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
              - receiver: self-healing
                continue: true
                matchers:
                - alertname = ServiceHighErrorRate
                - service_name = auth-service
              - receiver: discord
                continue: true
                matchers:
                - severity =~ "critical|warning"
              - receiver: jsm
                matchers:
                - severity =~ "critical|warning"
            receivers:
            - name: "null"
            - name: self-healing
              webhook_configs:
              - url_file: /etc/alertmanager/secrets/self-healing/url
                send_resolved: false
                http_config:
                  authorization:
                    credentials_file: /etc/alertmanager/secrets/self-healing/token
            - name: discord
              discord_configs:
              - webhook_url_file: /etc/alertmanager/secrets/discord/webhook_url
                title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} - {{ .CommonLabels.service_name }}'
                message: |-
                  Gravidade: {{ .CommonLabels.severity }}
                  {{ .CommonAnnotations.summary }}
                  {{ .CommonAnnotations.description }}
                send_resolved: true
            - name: jsm
              opsgenie_configs:
              - api_key_file: /etc/alertmanager/secrets/jsm-api-key/api_key
                api_url: https://api.atlassian.com/jsm/ops/integration/
                message: '{{ .CommonAnnotations.summary }}'
                description: '{{ .CommonAnnotations.description }}'
                priority: '{{ if eq .CommonLabels.severity "critical" }}P1{{ else }}P3{{ end }}'
                send_resolved: true
          alertmanagerSpec:
            secrets:
            - jsm-api-key
            - self-healing
            - discord
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        nodeExporter:
          enabled: true
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 24h
            enableRemoteWriteReceiver: true
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 100m
                memory: 400Mi
              limits:
                memory: 800Mi
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
          additionalDataSources:
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki.monitoring.svc.cluster.local:3100
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
