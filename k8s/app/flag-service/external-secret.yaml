apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flag-secret
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secretstore
    kind: ClusterSecretStore
  target:
    name: flag-service-secret
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: postgres://{{ .rds_username | urlquery }}:{{ .rds_password | urlquery }}@togglemaster-prod-flag-service-db.cmhac4oi49kr.us-east-1.rds.amazonaws.com:5432/flags_db
  data:
    - secretKey: rds_username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:762846202773:secret:rds!db-dca80ae7-9eed-4203-bd52-caf08e604eb4-iNa3tO
        property: username
    - secretKey: rds_password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:762846202773:secret:rds!db-dca80ae7-9eed-4203-bd52-caf08e604eb4-iNa3tO
        property: password
