apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["auth-service"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: self-healing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healing
