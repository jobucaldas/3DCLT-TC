apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  annotations:
    checkov.io/skip1: >-
      CKV_K8S_35=The application currently reads its secrets from environment variables; file-based secret consumption is not supported.
    checkov.io/skip2: >-
      CKV_K8S_38=The service account token is intentionally mounted because this workload may use AWS IRSA.
    checkov.io/skip3: >-
      CKV_K8S_43=The release contract uses the existing numeric image tag; digest pinning is intentionally out of scope.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      serviceAccountName: evaluation-service
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evaluation-service
          image: 762846202773.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:1.0.0
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 8004
          envFrom:
            - configMapRef:
                name: evaluation-service-config
            - secretRef:
                name: evaluation-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 256Mi
