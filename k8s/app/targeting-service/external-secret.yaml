apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: targeting-secret
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secretstore
    kind: ClusterSecretStore
  target:
    name: targeting-service-secret
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: postgres://{{ .rds_username | urlquery }}:{{ .rds_password | urlquery }}@togglemaster-prod-targeting-service-db.cmhac4oi49kr.us-east-1.rds.amazonaws.com:5432/targeting_db
  data:
    - secretKey: rds_username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:762846202773:secret:rds!db-1b1b9fb1-6090-4018-bd17-9bc039bccb70-KYiG2T
        property: username
    - secretKey: rds_password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:762846202773:secret:rds!db-1b1b9fb1-6090-4018-bd17-9bc039bccb70-KYiG2T
        property: password
