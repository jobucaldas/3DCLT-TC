apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - external-secret.yaml
  - alerts.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: dashboard-togglemaster
    namespace: monitoring
    files:
      - togglemaster.json=dashboards/togglemaster.json
    options:
      labels:
        grafana_dashboard: "1"
