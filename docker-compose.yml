x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

services:
  analytics-service:
    build: ../analytics-service
    ports:
      - "8005:8005"
    env_file:
      - ../analytics-service/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: analytics-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8005/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ../auth-service
    ports:
      - "8001:8001"
    env_file:
      - ../auth-service/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: auth-service
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  evaluation-service:
    build: ../evaluation-service
    ports:
      - "8004:8004"
    env_file:
      - ../evaluation-service/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: evaluation-service
    depends_on:
      auth-service:
        condition: service_healthy
      flag-service:
        condition: service_healthy
      targeting-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8004/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  flag-service:
    build: ../flag-service
    ports:
      - "8002:8002"
    env_file:
      - ../flag-service/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: flag-service
    depends_on:
      auth-service:
        condition: service_healthy
      flag-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8002/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  targeting-service:
    build: ../targeting-service
    ports:
      - "8003:8003"
    env_file:
      - ../targeting-service/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: targeting-service
    depends_on:
      auth-service:
        condition: service_healthy
      targeting-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8003/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:8.8.0-alpine3.23

  dynamodb:
    image: docker.io/amazon/dynamodb-local:3.3.0
    ports:
      - "8000:8000"

  auth-postgres:
    image: docker.io/postgres:18.4-alpine3.24
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=auth_db
    volumes:
      - auth_postgres_data:/var/lib/postgresql/
      - ../auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  flag-postgres:
    image: docker.io/postgres:18.4-alpine3.24
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=flags_db
    volumes:
      - flag_postgres_data:/var/lib/postgresql/
      - ../flag-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  targeting-postgres:
    image: docker.io/postgres:18.4-alpine3.24
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=targeting_db
    volumes:
      - targeting_postgres_data:/var/lib/postgresql/
      - ../targeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=env:OTEL_COLLECTOR_CONFIG"]
    environment:
      OTEL_COLLECTOR_CONFIG: |
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 0.0.0.0:4318
        processors:
          batch: {}
        connectors:
          spanmetrics:
            dimensions:
              - name: http.response.status_code
              - name: http.status_code
        exporters:
          otlp/jaeger:
            endpoint: jaeger:4317
            tls:
              insecure: true
          prometheus:
            endpoint: 0.0.0.0:8889
            resource_to_telemetry_conversion:
              enabled: true
        service:
          pipelines:
            traces:
              receivers: [otlp]
              processors: [batch]
              exporters: [spanmetrics, otlp/jaeger]
            metrics:
              receivers: [spanmetrics]
              exporters: [prometheus]
    ports:
      - "4318:4318"

  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -n '/^spec:/,$$p' /alerts/alerts.yaml | sed '1d;s/^  //' > /tmp/rules.yml
        printf '%s\n' \
          'global: {scrape_interval: 5s, evaluation_interval: 5s}' \
          'rule_files: [/tmp/rules.yml]' \
          'scrape_configs:' \
          '  - job_name: otel-collector' \
          '    static_configs: [{targets: ["otel-collector:8889"]}]' \
          > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
    volumes:
      - ./k8s/observability/alerts.yaml:/alerts/alerts.yaml:ro,z
    ports:
      - "9090:9090"

  grafana:
    image: docker.io/grafana/grafana:12.1.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/prov/datasources /tmp/prov/dashboards
        printf '%s\n' 'apiVersion: 1' 'datasources:' \
          '  - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://prometheus:9090", isDefault: true}' \
          > /tmp/prov/datasources/ds.yml
        printf '%s\n' 'apiVersion: 1' 'providers:' \
          '  - {name: togglemaster, type: file, options: {path: /var/lib/grafana/dashboards}}' \
          > /tmp/prov/dashboards/db.yml
        exec /run.sh
    environment:
      GF_PATHS_PROVISIONING: /tmp/prov
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./k8s/observability/dashboards:/var/lib/grafana/dashboards:ro,z
    ports:
      - "3000:3000"

volumes:
  targeting_postgres_data:
  auth_postgres_data:
  flag_postgres_data:
